<style>
    /* The submit button of the AD FS default theme is #0067b8 with white text (contrast 5.8:1). Use the same
       color, so the buttons match the theme and meet the 4.5:1 minimum. The secondary buttons use the lightest
       gray that meets 4.5:1 with white text (#767676, 4.54:1). Error texts use the theme's "error" class, so
       they follow a custom theme. */
    .pi-button {
        background-color: #0067b8;
        border: none;
        border-style: solid;
        border-width: 1px;
        height: 35px;
        min-width: 160px;
        width: auto;
        color: white;
        margin-bottom: 8px;
        user-select: none;
        padding: 8px 25px 12px 25px;
    }
    .pi-button-secondary {
        background-color: #767676;
    }
</style>
<div id="loginArea" class="pi-no-js" data-mode="#mode#" data-push-available="#pushAvailable#" data-disable-otp="#disableOTP#"
     data-push-state="#pushPollState#">
    <!-- Fallback for clients where the page script does not run to the end: scripting is disabled, or the
         engine cannot parse or run the script. The pi-no-js class on #loginArea switches these rules on. The
         script removes the class as the last step of its setup, so with a working script they never apply.
         (A <noscript> block would cover only "scripting disabled", not a script that fails.)
         One-time-password entry works without JavaScript: the server treats an empty formResult as a plain OTP
         submit. These rules hide the controls that only work with JavaScript (WebAuthn, passkey, mode switch,
         copy-to-clipboard, skip enrollment) and reveal the enrollment block that the script would otherwise
         un-hide. Push has no auto-poll without JavaScript, so in push mode the OTP input is hidden and a manual
         "I confirmed on my device" button is shown: each click re-posts the form, which polls the transaction
         once. The button is not shown after the user declined the push on the device (data-push-state=refused),
         because another check cannot succeed. The remember-device checkbox is not revealed: only JavaScript can
         store its cookie. -->
    <style>
        #loginArea.pi-no-js .pi-js-only { display: none !important; }
        #loginArea.pi-no-js #enrollmentBlock[data-enrollment-mode="image"] .enrollment-image,
        #loginArea.pi-no-js #enrollmentBlock[data-enrollment-mode="legacy"] .enrollment-legacy { display: block !important; }
        /* The script removes the enrollment link when there is none. Without the script, hide an empty one. */
        #loginArea.pi-no-js .enrollment-link[href=""] { display: none !important; }
        #loginArea.pi-no-js[data-mode="push"] #otp,
        #loginArea.pi-no-js[data-mode="push"] #submitButton { display: none !important; }
        #loginArea.pi-no-js[data-mode="push"]:not([data-push-state="refused"]) #pushConfirmButton { display: inline-block !important; }
        /* Token-type switch without JavaScript: offer OTP while in push mode (unless OTP is disabled), and offer
           push in every other mode (OTP, WebAuthn, an enrollment type) when a push token is available. */
        #loginArea.pi-no-js[data-mode="push"]:not([data-disable-otp="1"]) #noJsSwitchToOtp { display: inline-block !important; }
        #loginArea.pi-no-js:not([data-mode="push"])[data-push-available="1"] #noJsSwitchToPush { display: inline-block !important; }
    </style>
    <noscript>
        <p>#txtNoScript#</p>
    </noscript>
    <!-- Enrollment Message -->
    <div id="enrollmentBlock" data-enrollment-mode="#enrollmentMode#">
        <!-- mode=legacy: full instructions (driven by deprecated enable_enrollment registry flag) -->
        <div class="enrollment-legacy" style="display:none">
            <p class="error"><i>#txtLegacyIntro# <b>#txtLegacyWarning#</b></i></p>
            <br/>
            <ol>
                <li>
                    #txtLegacyStep1#
                    <ul>
                        <li>privacyIDEA Authenticator <a target="_blank" rel="noopener noreferrer" href="https://play.google.com/store/apps/details?id=it.netknights.piauthenticator&hl=en_US&gl=US">(Android)</a> <a target="_blank" rel="noopener noreferrer" href="https://apps.apple.com/us/app/privacyidea-authenticator/id1445401301">(iOS)</a></li>
                        <li>Google Authenticator <a target="_blank" rel="noopener noreferrer" href="https://play.google.com/store/apps/details?id=com.google.android.apps.authenticator2&hl=en_US&gl=US">(Android)</a> <a target="_blank" rel="noopener noreferrer" href="https://apps.apple.com/us/app/google-authenticator/id388497605">(iOS)</a></li>
                        <li>Authy <a target="_blank" rel="noopener noreferrer" href="https://authy.com/download/">(Mobile/Desktop)</a></li>
                    </ul>
                </li>
                <li>
                    #txtLegacyStep2#
                    <img class="enrollment-img" src="#enrollmentImg#" width="325px" alt="#txtEnrollmentQrAlt#">
                    <input id="enrollmentValue" value="#enrollmentUrl#" class="text" size="30" readonly aria-label="#txtLegacyLinkLabel#"/>
                    <!-- type=button: a <button> without a type inside a form would submit it. This one is outside the
                         form, but the type keeps it safe if the markup moves. -->
                    <button type="button" onclick="copyTOTP()" class="pi-button pi-js-only">#txtLegacyCopy#</button>
                </li>
                <li>#txtLegacyStep3#</li>
            </ol>
        </div>
        <!-- mode=image: QR from server-driven enroll_via_multichallenge + optional fallback link -->
        <div class="enrollment-image" style="display:none">
            <img class="enrollment-img" src="#enrollmentImg#" width="325px" alt="#txtEnrollmentQrAlt#">
            <a class="enrollment-link" href="#enrollmentLink#" target="_blank" rel="noopener noreferrer">#txtEnrollmentLinkText#</a>
        </div>
    </div>
   
    <form method="post" id="loginForm">
        <!-- These inputs are required by the presentation framework. Do not modify or remove -->
        <input id="authMethod" type="hidden" name="AuthMethod" value="%AuthMethod%" />
        <input id="context" type="hidden" name="Context" value="%Context%" />
        <!-- End inputs are required by the presentation framework. -->

        <p id="pageIntroductionText" class="error">#ERROR#</p>
        <!-- Messages that the page script shows without a reload: a failed WebAuthn or passkey prompt, or the
             stop of the automatic push check. role=status makes screen readers announce a new text. -->
        <p id="clientMessage" role="status"></p>
        <br />
        <label for="otp" class="block">#otpLabel#</label>
        <input id="otp" name="otp" type="password" value="" class="text" placeholder="#OTPTEXT#" size="35" autocomplete="one-time-code" autofocus />
        <!-- The click handler only fills formResult. The browser then submits the form itself, because calling
             form.submit() from the click handler of a submit button can send the form twice in Internet Explorer. -->
        <input id="submitButton" type="submit" name="Submit" value="#txtSubmit#" onclick="prepareSubmit()" />
        <!-- Manual push check. Each press re-posts the form, which polls the transaction once. Without JavaScript
             the fallback rules show it in push mode. With JavaScript the page checks on a timer and shows this
             button after the user or the time limit stopped the timer. It is placed after the normal submit
             button so that stays the implicit submitter. -->
        <input id="pushConfirmButton" type="submit" name="Submit" value="#pushButtonLabel#" class="pi-button" style="display:none"
               onclick="prepareSubmit()" />
        <!-- Stops the automatic push check (JS-only). The page script shows it while the timer runs. -->
        <input id="pushStopButton" type="button" value="#txtPushStop#" onclick="stopPushPolling()"
               class="pi-button pi-button-secondary pi-js-only" style="display:none" />
        <!-- No-JavaScript token-type switch. The noscript rules reveal only the one that applies: "Use
             one-time password" in push mode, "Use push" in OTP mode when push is available. Each posts
             noJsModeSwitch, which the adapter treats as a mode change and re-renders the form. A <button>
             keeps the posted value ("otp"/"push") separate from the visible label, and type=submit needs
             no script. Placed after the normal submit so that stays the implicit submitter. -->
        <button id="noJsSwitchToOtp" type="submit" name="noJsModeSwitch" value="otp"
                class="pi-button pi-button-secondary" style="display:none">#txtUseOtp#</button>
        <button id="noJsSwitchToPush" type="submit" name="noJsModeSwitch" value="push"
                class="pi-button pi-button-secondary" style="display:none">#txtUsePush#</button>

        <!-- Remember this device. Hidden unless the server offers the feature (rememberDeviceEnabled=1);
             the page JS and the noscript rule un-hide it then. Posts a plain rememberDevice field (value 1
             when checked); the JS path also copies it into formResult. -->
        <div id="rememberDeviceDiv" data-enabled="#rememberDeviceEnabled#" style="display:none">
            <label><input id="rememberDevice" name="rememberDevice" type="checkbox" value="1" #rememberDeviceChecked# /> #txtRememberDevice#</label>
        </div>

        <!-- Carriers for the device cookie, read by the JS below (no name, so they are not posted back). -->
        <input id="deviceCookieValue" type="hidden" value="#deviceCookieValue#" />
        <input id="deviceCookieMaxAge" type="hidden" value="#deviceCookieMaxAge#" />
        <input id="deviceCookieClear" type="hidden" value="#deviceCookieClear#" />

        <input id="autoSubmit" type="hidden" name="autoSubmit" value="#autoSubmit#" />
        <input id="mode" type="hidden" name="mode" value="#mode#" />
        <input id="pushAvailable" type="hidden" name="pushAvailable" value="#pushAvailable#" />
        <input id="webAuthnSignRequest" type="hidden" name="webAuthnSignRequest" value="#webAuthnSignRequest#" />
        <input id="passkeyChallenge" type="hidden" name="passkeyChallenge" value="#passkeyChallenge#" />
        <input id="passkeyRegistration" type="hidden" name="passkeyRegistration" value="#passkeyRegistration#" />
        <input id="authCounter" type="hidden" name="authCounter" value="#authCounter#" />
        <input id="disablePasskey" type="hidden" name="disablePasskey" value="#disablePasskey#" />
        <input id="autoSubmitLength" type="hidden" name="autoSubmitLength" value="#autoSubmitLength#" />
        <input id="formResult" type="hidden" name="formResult" value="" />
        <input id="disableOTP" type="hidden" name="disableOTP" value="#disableOTP#" />
        <input id="enrollmentOptional" type="hidden" name="enrollmentOptional" value="#enrollmentOptional#" />
        <!-- Push check state, posted back so that it survives the reload (see startPushPolling). -->
        <input id="pushPollState" type="hidden" name="pushPollState" value="#pushPollState#" />
        <input id="pushPollStarted" type="hidden" name="pushPollStarted" value="#pushPollStarted#" />
        <input id="focusId" type="hidden" name="focusId" value="#focusId#" />

        <!-- Carriers for the page script (no name, so they are not posted back): the push check interval and
             the translated texts that the script shows. -->
        <input id="pushPollInterval" type="hidden" value="#pushPollInterval#" />
        <input id="txtPushStopped" type="hidden" value="#txtPushStopped#" />
        <input id="txtWebAuthnFailed" type="hidden" value="#txtWebAuthnFailed#" />
        <input id="txtPasskeyFailed" type="hidden" value="#txtPasskeyFailed#" />
        <input id="txtPasskeyRegistrationFailed" type="hidden" value="#txtPasskeyRegistrationFailed#" />

        <!-- Extra inputs to persist some data -->
        <input id="message" type="hidden" name="message" value="#MESSAGE#" />
        <input id="enrollmentLink" type="hidden" name="enrollmentLink" value="#enrollmentLink#" />
        <input id="enrollmentImg" type="hidden" name="enrollmentImg" value="#enrollmentImg#" />

        <!-- The buttons have no aria-label: the accessible name is the visible text, so speech input that says
             the visible text reaches the button (WCAG 2.5.3). The group name "Other Login Options" gives the
             short labels their context. -->
        <!-- Retry Passkey Registration (JS-only) -->
        <input id="retryPasskeyRegistration" name="retryPasskeyRegistration" type="button" value="#txtRetryPasskeyRegistration#"
               onclick="registerPasskey()" class="pi-button pi-js-only" />

        <!-- Skip optional enroll-via-multichallenge (JS-only) -->
        <input id="skipEnrollmentButton" name="skipEnrollmentButton" type="button" value="#txtNotNow#" onclick="skipEnrollment()"
               class="pi-button pi-button-secondary pi-js-only" />

        <!-- Alternate login options are all JS-driven (WebAuthn, Passkey, Push, mode switch); hide for no-JS. -->
        <div id="alternateTokenDiv" class="groupMargin pi-js-only" role="group" aria-labelledby="alternateTokenLabel">
            <span id="alternateTokenLabel">#txtOtherLoginOptions#</span>
            <br />
            <!-- Passkey -->
            <input id="passkeyLoginButton" name="passkeyLoginButton" type="button" value="#txtPasskey#" onclick="requestPasskeyLogin()"
                   class="pi-button" />
            <!-- Retry Passkey Login -->
            <input id="retryPasskeyLogin" name="retryPasskeyLogin" type="button" value="#txtRetryPasskeyLogin#" onclick="passkeyAuthentication()"
                   class="pi-button" />
            <!-- WebAuthn -->
            <input id="useWebAuthnButton" name="useWebAuthnButton" type="button" value="#txtWebAuthn#" onclick="doWebAuthn()"
                   class="pi-button" />
            <!-- Push-->
            <input id="usePushButton" name="usePushButton" type="button" value="#txtPush#" onclick="changeMode('push')"
                   class="pi-button" />
            <!-- OTP -->
            <input id="useOTPButton" name="useOTPButton" type="button" value="#txtOtp#" onclick="changeMode('otp')"
                   class="pi-button" />
        </div>

        <script>
            'use strict';
            // This script must also run in old engines: Internet Explorer 11 (ES5 only) and the legacy Edge
            // engine (EdgeHTML 18) that older Office sign-in windows embed. These engines compile the whole
            // block at once, so one unsupported token is a syntax error that disables every function here.
            // Write ES5 only: var (no let or const), function expressions (no arrow functions), no template
            // literals, no for...of, no trailing commas in calls. Check for newer browser APIs before use.
            // tools/Check-AuthPageEcmaScript.ps1 enforces this in CI.

            // Old Internet Explorer versions define console only while the developer tools are open.
            if (typeof window.console === "undefined") {
                window.console = { log: function () { } };
            }

            // Keep in sync with PITokenType in PIConstants.cs.
            var MODE = { OTP: "otp", PUSH: "push", WEBAUTHN: "webauthn", PASSKEY: "passkey" };

            // Security keys and passkeys need WebAuthn. Internet Explorer 11 does not have it.
            var webAuthnSupported = !!(window.PublicKeyCredential && navigator.credentials
                && typeof navigator.credentials.get === "function" && typeof window.Promise === "function");

            // Push check. AD FS calls the adapter only when the page posts the form, so the page posts itself on
            // a timer, and each post asks the server once whether the push is confirmed. To keep this usable with
            // a keyboard, speech input or a screen reader:
            // - The interval is push_poll_interval (default 3 seconds), the same for every check.
            // - After each reload, the focus goes back to the control that had it (focusId).
            // - The user can stop the automatic check (pushStopButton). Then the "I confirmed on my device"
            //   button checks once per press. The page also stops by itself after PUSH_POLL_LIMIT_MS, because an
            //   expired challenge never becomes confirmed, and an abandoned page would post forever.
            // - After the user declined or cancelled the push on the device, the adapter sets pushPollState to
            //   "refused", and the page does not check again.
            var PUSH_POLL_LIMIT_MS = 5 * 60 * 1000;
            var pushTimer = null;
            // The element that gets the focus when the setup is done. A push check sets it (see above).
            var initialFocusId = value("focusId");

            var formResult = {
                passkeyLoginRequested: false,
                enrollmentCancelled: false,
                modeChanged: false,
                newMode: "",
                webAuthnSignResponse: "",
                passkeySignResponse: "",
                passkeyRegistrationResponse: "",
                origin: "",
                rememberDevice: false
            };

            // Remember-device cookie handling. The adapter cannot set a response cookie from an AD FS
            // adapter, so the cookie is managed here. The value is the opaque series:counter token.
            // - Secure: sent only over https.
            // - Not HttpOnly: only JavaScript can set it here, and JavaScript cannot set HttpOnly.
            // - SameSite=Lax, not Strict: the provider reads the cookie only when AD FS asks for the second
            //   factor (BeginAuthentication). That request is often part of a navigation that started on
            //   another site, for example a redirect from login.microsoftonline.com or a relying party, with
            //   Windows Integrated Authentication or an AD FS SSO session as the first factor. Browsers do not
            //   send a Strict cookie on such a navigation, so the device would never be recognized there. Lax
            //   cookies are sent on top-level navigations from other sites, but not on cross-site POSTs or
            //   embedded requests. README.md ("Remember this device") explains the trade-off.
            (function () {
                // Internet Explorer ignores max-age, so each cookie also carries the equivalent expires date.
                // Browsers that support max-age use it and ignore expires.
                var deleteCookie = "pi_remember_device=; path=/; max-age=0; expires=Thu, 01 Jan 1970 00:00:00 GMT; secure; samesite=lax";
                var clear = document.querySelector("#deviceCookieClear");
                if (clear && clear.value === "1") {
                    document.cookie = deleteCookie;
                }
                var cv = document.querySelector("#deviceCookieValue");
                if (cv && cv.value !== "") {
                    var maEl = document.querySelector("#deviceCookieMaxAge");
                    var maxAge = parseInt(maEl ? maEl.value : "", 10);
                    if (isFinite(maxAge) && maxAge > 0) {
                        var expires = new Date(new Date().getTime() + maxAge * 1000).toUTCString();
                        document.cookie = "pi_remember_device=" + cv.value + "; path=/; max-age=" + maxAge +
                            "; expires=" + expires + "; secure; samesite=lax";
                    } else {
                        // No usable Max-Age from the server. Do not invent a lifetime for a security token.
                        // Remove any existing cookie instead of storing one that cannot be aged correctly.
                        document.cookie = deleteCookie;
                    }
                }
            })();

            // Show the remember-device checkbox when the server offers the feature.
            var rememberDiv = document.querySelector("#rememberDeviceDiv");
            if (rememberDiv && rememberDiv.getAttribute("data-enabled") === "1") {
                rememberDiv.style.display = "block";
            }

            disable("retryPasskeyLogin");
            disable("retryPasskeyRegistration");
            if (value("enrollmentOptional") !== "1") {
                disable("skipEnrollmentButton");
            }

            // Reveal the enrollment block matching the active mode, or drop it entirely so the
            // hidden <img src=""> doesn't trigger a spurious browser request.
            var enrollmentBlock = document.querySelector("#enrollmentBlock");
            var enrollmentMode = (enrollmentBlock && enrollmentBlock.getAttribute("data-enrollment-mode")) || "none";
            if (enrollmentMode === "legacy") {
                var legacyEl = document.querySelector(".enrollment-legacy");
                if (legacyEl) legacyEl.style.display = "block";
            } else if (enrollmentMode === "image") {
                var imageEl = document.querySelector(".enrollment-image");
                if (imageEl) imageEl.style.display = "block";
                if (value("enrollmentLink") === "") {
                    removeElement(document.querySelector(".enrollment-link"));
                }
            } else {
                removeElement(enrollmentBlock);
            }

            if (value("autoSubmit") === "1") {
                submitForm();
            }

            if (value("webAuthnSignRequest") === "") {
                disable("useWebAuthnButton");
            }

            if (value("pushAvailable") === "0") {
                disable("usePushButton");
            }

            // Without WebAuthn (for example in Internet Explorer 11) security keys and passkeys cannot work:
            // hide their buttons and never start a prompt. One-time password and push still work.
            if (!webAuthnSupported) {
                disable("passkeyLoginButton");
                disable("useWebAuthnButton");
            }

            if (value("passkeyChallenge") != "") {
                disable("passkeyLoginButton");
                if (webAuthnSupported) {
                    enable("retryPasskeyLogin");
                    passkeyAuthentication();
                }
            }

            if (value("passkeyRegistration") != "") {
                disable("passkeyLoginButton");
                disable("alternateTokenDiv");
                disable("submitButton");
                disable("otp");

                if (webAuthnSupported) {
                    enable("retryPasskeyRegistration");
                    registerPasskey();
                }
            }

            var asl = value("autoSubmitLength");
            if (asl !== "") {
                setAutoSubmit(asl);
            }

            if (value("disablePasskey") == "1") {
                disable("passkeyLoginButton");
                disable("retryPasskeyLogin");
            }

            if (value("disableOTP") === "1") {
                disable("otp");
                disable("submitButton");
                disable("useOTPButton");
            }

            switch (value("mode")) {
                case MODE.PUSH:
                    disable("otp");
                    disable("usePushButton");
                    disable("submitButton");
                    startPushPolling();
                    break;
                case MODE.OTP:
                    disable("useOTPButton");
                    break;
                case MODE.WEBAUTHN:
                    disable("otp");
                    disable("submitButton");
                    doWebAuthn();
                    break;
            }

            setLoginOptionsVisibility();

            // The setup above ran to the end: switch off the fallback rules (pi-no-js, see the top of this
            // file). Keep this the last statement of the setup, so that a script that fails earlier leaves the
            // fallback in place.
            var loginAreaElement = document.getElementById("loginArea");
            if (loginAreaElement) {
                loginAreaElement.className = loginAreaElement.className.replace(/(^|\s)pi-no-js(\s|$)/, " ");
            }
            // After the fallback rules are off, so that the visibility check sees the final page.
            focusElement(initialFocusId);

            function startPushPolling() {
                var state = value("pushPollState");
                if (state === "refused") {
                    return;
                }
                if (state === "stopped") {
                    showManualPushCheck();
                    if (initialFocusId === "") {
                        initialFocusId = "pushConfirmButton";
                    }
                    return;
                }
                var now = new Date().getTime();
                var started = parseInt(value("pushPollStarted"), 10);
                if (!isFinite(started) || started <= 0 || started > now) {
                    // The first check of this push, or the clock of the device changed.
                    set("pushPollStarted", String(now));
                } else if (now - started >= PUSH_POLL_LIMIT_MS) {
                    stopPushPolling();
                    initialFocusId = "pushConfirmButton";
                    return;
                }
                var interval = parseInt(value("pushPollInterval"), 10);
                if (!isFinite(interval) || interval < 1) {
                    interval = 3;
                }
                enable("pushStopButton");
                pushTimer = setTimeout(function () {
                    pushTimer = null;
                    prepareSubmit();
                    set("focusId", focusedElementId());
                    sendForm();
                }, interval * 1000);
            }

            // Called by the "Stop automatic check" button and by the time limit.
            function stopPushPolling() {
                cancelPushTimer();
                set("pushPollState", "stopped");
                showManualPushCheck();
                var confirmButton = document.getElementById("pushConfirmButton");
                var label = confirmButton ? confirmButton.value : "";
                showClientMessage(value("txtPushStopped").replace("{0}", label), false);
                // The stop button is hidden now. Move the focus to the button that checks the push.
                focusElement("pushConfirmButton");
            }

            function showManualPushCheck() {
                disable("pushStopButton");
                enable("pushConfirmButton");
            }

            function cancelPushTimer() {
                if (pushTimer !== null) {
                    clearTimeout(pushTimer);
                    pushTimer = null;
                }
            }

            // The id of the focused control in the login area, or "" (only ids made of letters, which the
            // adapter accepts back).
            function focusedElementId() {
                var active = document.activeElement;
                var area = document.getElementById("loginArea");
                if (active && active !== area && area && area.contains(active) && /^[A-Za-z]+$/.test(active.id || "")) {
                    return active.id;
                }
                return "";
            }

            function focusElement(id) {
                if (!id) {
                    return;
                }
                var element = document.getElementById(id);
                if (!element) {
                    return;
                }
                for (var node = element; node && node.nodeType === 1; node = node.parentNode) {
                    if (window.getComputedStyle(node).display === "none") {
                        return;
                    }
                }
                try {
                    element.focus();
                } catch (e) {
                    // Internet Explorer throws when the element cannot take the focus.
                }
            }

            // Shows a message without a reload. isError uses the "error" class of the AD FS theme.
            function showClientMessage(text, isError) {
                var element = document.getElementById("clientMessage");
                if (!element) {
                    return;
                }
                element.className = isError ? "error" : "";
                element.textContent = text;
            }

            function doWebAuthn() {
                // changeMode() re-renders/submits the form, so return immediately after calling it —
                // otherwise execution continues and may start a WebAuthn prompt against an unloading page
                // (mirrors the early-return pattern in passkeyAuthentication()).
                // Push mode auto-resubmits the form on a timer, which would interrupt the WebAuthn prompt.
                if (value("mode") === MODE.PUSH) {
                    changeMode(MODE.WEBAUTHN);
                    return;
                }

                if (!webAuthnSupported) {
                    console.log("WebAuthn is not available in this browser: switching to one-time password.");
                    changeMode(MODE.OTP);
                    return;
                }

                if (!window.isSecureContext) {
                    console.log("Insecure context detected: Aborting WebAuthn authentication!");
                    changeMode(MODE.OTP);
                    return;
                }

                var requestStr = value("webAuthnSignRequest");

                if (requestStr.length === 0) {
                    changeMode(MODE.OTP);
                    return;
                }

                try {
                    var requestjson = JSON.parse(requestStr);

                    var webAuthnSignResponse = webAuthnSign(requestjson);
                    webAuthnSignResponse.then(function (webauthnresponse) {
                        var response = JSON.stringify(webauthnresponse);
                        formResult.webAuthnSignResponse = response;
                        submitForm();
                    }, function (error) {
                        // The user cancelled the prompt, the key is not registered, or the prompt timed out.
                        console.log("WebAuthn authentication error: " + error);
                        showClientMessage(value("txtWebAuthnFailed"), true);
                    });
                } catch (err) {
                    console.log("Error while signing WebAuthnSignRequest: " + err);
                    showClientMessage(value("txtWebAuthnFailed"), true);
                }
            }

            function setLoginOptionsVisibility() {
                var ids = ["passkeyLoginButton", "retryPasskeyLogin", "useOTPButton", "usePushButton", "useWebAuthnButton"];
                var shouldShow = false;
                for (var i = 0; i < ids.length; i++) {
                    var option = document.querySelector("#" + ids[i]);
                    if (option && window.getComputedStyle(option).display !== "none" && window.getComputedStyle(option).display !== "hidden") {
                        console.log("shouldshow=true because of " + ids[i]);
                        shouldShow = true;
                        break;
                    }
                }
                if (!shouldShow) {
                    var alternateDiv = document.querySelector("#alternateTokenDiv");
                    if (alternateDiv) {
                        alternateDiv.style.display = "none";
                    }
                }

                // If the otp input field is visible, hide the otp button
                var otpInput = document.querySelector("#otp");
                if (otpInput && otpInput.style.display !== "none" && otpInput.style.display !== "hidden") {
                    var otpButton = document.querySelector("#useOTPButton");
                    if (otpButton) {
                        otpButton.style.display = "none";
                    }
                }
            }

            // Writes the collected state into the hidden formResult field. The Submit button calls only this
            // and lets the browser submit the form, because calling form.submit() from the click handler of a
            // submit button can send the form twice in Internet Explorer.
            function prepareSubmit() {
                // window.origin does not exist in Internet Explorer or EdgeHTML, but location.origin does.
                var origin = window.origin || window.location.origin;
                if (!origin) {
                    origin = window.location.protocol + "//" + window.location.hostname +
                        (window.location.port ? ':' + window.location.port : '');
                }
                formResult.origin = origin;
                var rememberBox = document.querySelector("#rememberDevice");
                if (rememberBox) {
                    formResult.rememberDevice = rememberBox.checked;
                }
                set("formResult", JSON.stringify(formResult));
                // Only the timed push check keeps the focus across the reload. It sets focusId after this call.
                set("focusId", "");
            }

            // Prepares and submits the form from script (mode changes, WebAuthn and passkey results, auto-submit).
            function submitForm() {
                // The page unloads now. A push check that fires in between would send the form a second time.
                cancelPushTimer();
                prepareSubmit();
                sendForm();
            }

            function sendForm() {
                var form = document.forms["loginForm"];
                if (typeof form.requestSubmit === "function") {
                    form.requestSubmit();
                } else {
                    // Internet Explorer and EdgeHTML have no requestSubmit(). Call the prototype method, so that
                    // a form control named "submit" cannot shadow it.
                    HTMLFormElement.prototype.submit.call(form);
                }
            }


            function value(id) {
                var element = document.querySelector("#" + id);
                if (element != null) {
                    return element.value;
                } else {
                    console.log(id + " is null!");
                }
                return "";
            }

            function set(id, value) {
                var element = document.querySelector("#" + id);
                if (element != null) {
                    element.value = value;
                } else {
                    console.log(id + " is null!");
                }
            }

            function disable(id) {
                var element = document.querySelector("#" + id);
                if (element != null) {
                    element.style.display = "none";
                } else {
                    console.log(id + " is null!");
                }
            }

            function enable(id) {
                var element = document.querySelector("#" + id);
                if (element != null) {
                    try {
                        element.style.display = "initial";
                    } catch (e) {
                        // Old Internet Explorer document modes throw on an unknown CSS value.
                    }
                    // Internet Explorer does not know the "initial" keyword and keeps the old value. Remove the
                    // inline value instead, so that the element falls back to its default display.
                    if (element.style.display !== "initial") {
                        element.style.display = "";
                    }
                } else {
                    console.log(id + " is null!");
                }
            }

            // Element.remove() does not exist in Internet Explorer.
            function removeElement(element) {
                if (element && element.parentNode) {
                    element.parentNode.removeChild(element);
                }
            }

            function changeMode(newMode) {
                document.querySelector("#mode").value = newMode;
                formResult.newMode = newMode;
                formResult.modeChanged = true;
                submitForm();
            }

            function requestPasskeyLogin() {
                formResult.passkeyLoginRequested = true;
                submitForm();
            }

            function skipEnrollment() {
                formResult.enrollmentCancelled = true;
                submitForm();
            }

            function copyTOTP() {
                var copyText = document.querySelector("#enrollmentValue");
                copyText.select();
                copyText.setSelectionRange(0, 99999); /* For mobile devices */
                if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
                    navigator.clipboard.writeText(copyText.value);
                } else {
                    // Internet Explorer has no Clipboard API. Copy the selected text instead.
                    try {
                        document.execCommand("copy");
                    } catch (e) {
                        console.log("Could not copy the text: " + e);
                    }
                }
            }

            function setAutoSubmit(inputLength) {
                var otpField = document.querySelector("#otp");
                if (otpField) {
                    otpField.addEventListener("keyup", function () {
                        if (otpField.value.length === parseInt(inputLength)) {
                            submitForm();
                        }
                    });
                }
            }

            function passkeyAuthentication() {
                if (!webAuthnSupported) {
                    console.log("Passkeys need WebAuthn, which this browser does not have.");
                    return "";
                }
                if (value("mode") === MODE.PUSH) {
                    changeMode(MODE.PASSKEY);
                    return;
                }
                var passkeyChallenge = value("passkeyChallenge");
                if (passkeyChallenge == "") {
                    console.log("Passkey Authentication: Challenge data is empty!");
                    return "";
                }
                var challengeObject = JSON.parse(passkeyChallenge.replace(/(&quot;)/g, "\""));
                var userVerification = "preferred";
                if (["required", "preferred", "discouraged"].indexOf(challengeObject.user_verification) !== -1) {
                    userVerification = challengeObject.user_verification;
                }
                navigator.credentials.get({
                    publicKey: {
                        challenge: Uint8Array.from(challengeObject.challenge, function (c) { return c.charCodeAt(0); }),
                        rpId: challengeObject.rpId,
                        userVerification: userVerification
                    }
                }).then(function (credential) {
                    var params = {
                        transaction_id: challengeObject.transaction_id,
                        credential_id: credential.id,
                        authenticatorData: bytesToBase64(
                            new Uint8Array(credential.response.authenticatorData)),
                        clientDataJSON: bytesToBase64(new Uint8Array(credential.response.clientDataJSON)),
                        signature: bytesToBase64(new Uint8Array(credential.response.signature)),
                        userHandle: bytesToBase64(new Uint8Array(credential.response.userHandle))
                    };
                    formResult.passkeySignResponse = JSON.stringify(params);
                    submitForm();
                }, function (error) {
                    console.log("Passkey authentication error: " + error);
                    showClientMessage(value("txtPasskeyFailed"), true);
                });
            }

            function registerPasskey() {
                if (!webAuthnSupported) {
                    console.log("Passkeys need WebAuthn, which this browser does not have.");
                    return "";
                }
                var registrationData = value("passkeyRegistration");
                if (registrationData == "") {
                    console.log("Passkey Registration: Registration data is empty!");
                    return "";
                }
                var data = JSON.parse(registrationData.replace(/(&quot;)/g, "\""));
                var excludedCredentials = [];
                if (data.excludeCredentials) {
                    for (var i = 0; i < data.excludeCredentials.length; i++) {
                        var cred = data.excludeCredentials[i];
                        excludedCredentials.push({
                            id: base64URLToBytes(cred.id),
                            type: cred.type
                        });
                    }
                }

                return navigator.credentials.create({
                    publicKey: {
                        rp: data.rp,
                        user: {
                            id: base64URLToBytes(data.user.id),
                            name: data.user.name,
                            displayName: data.user.displayName
                        },
                        challenge: Uint8Array.from(data.challenge, function (c) { return c.charCodeAt(0); }),
                        pubKeyCredParams: data.pubKeyCredParams,
                        excludeCredentials: excludedCredentials,
                        authenticatorSelection: data.authenticatorSelection,
                        timeout: data.timeout,
                        extensions: {
                            credProps: true
                        },
                        attestation: data.attestation
                    }
                }).then(function (publicKeyCred) {
                    var params = {
                        credential_id: publicKeyCred.id.replace(/\+/g, '-').replace(/\//g, '_'),
                        rawId: bytesToBase64(new Uint8Array(publicKeyCred.rawId)),
                        authenticatorAttachment: publicKeyCred.authenticatorAttachment,
                        attestationObject: bytesToBase64(
                            new Uint8Array(publicKeyCred.response.attestationObject)),
                        clientDataJSON: bytesToBase64(new Uint8Array(publicKeyCred.response.clientDataJSON))
                    };
                    if (publicKeyCred.response.attestationObject) {
                        params.attestationObject = bytesToBase64(
                            new Uint8Array(publicKeyCred.response.attestationObject));
                    }
                    var extResults = publicKeyCred.getClientExtensionResults();
                    if (extResults.credProps) {
                        params.credProps = extResults.credProps;
                    }
                    formResult.passkeyRegistrationResponse = JSON.stringify(params);
                    submitForm();
                }, function (error) {
                    console.log("Error while registering passkey:");
                    console.log(error);
                    showClientMessage(value("txtPasskeyRegistrationFailed"), true);
                    return null;
                });
            }

            function bytesToBase64(bytes) {
                var binString = "";
                for (var i = 0; i < bytes.length; i++) {
                    binString += String.fromCharCode(bytes[i]);
                }
                return btoa(binString).replace(/\+/g, '-').replace(/\//g, '_');
            }

            // Appends "=" until the length is a multiple of 4. String.padEnd does not exist in Internet Explorer.
            function padBase64(base64) {
                var padLength = (4 - (base64.length % 4)) % 4;
                for (var i = 0; i < padLength; i++) {
                    base64 += "=";
                }
                return base64;
            }

            function base64URLToBytes(base64URLString) {
                var base64 = base64URLString.replace(/-/g, '+').replace(/_/g, '/');
                var binary = atob(padBase64(base64));
                var buffer = new ArrayBuffer(binary.length);
                var bytes = new Uint8Array(buffer);
                for (var i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return buffer;
            }

            // WebAuthn uses base64url WITHOUT `=` padding (per spec). The passkey helpers above
            // keep the `=` padding — that difference is load-bearing for the server, so the two
            // encoding paths intentionally diverge.
            function webAuthnBase64DecToArr(b64url) {
                var b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
                var binary = atob(padBase64(b64));
                var bytes = new Uint8Array(binary.length);
                for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                return bytes;
            }

            function webAuthnBase64EncArr(buffer) {
                var bytes = buffer instanceof Uint8Array ? buffer : new Uint8Array(buffer);
                var binString = "";
                for (var i = 0; i < bytes.length; i++) {
                    binString += String.fromCharCode(bytes[i]);
                }
                return btoa(binString).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
            }

            function utf8ArrToStr(aBytes) {
                var sView = "";

                for (var nPart, nLen = aBytes.length, nIdx = 0; nIdx < nLen; nIdx++) {
                    nPart = aBytes[nIdx];
                    sView += String.fromCharCode(
                        nPart > 251 && nPart < 254 && nIdx + 5 < nLen ?
                            (nPart - 252) * 1073741824 /* << 30 */
                            + (aBytes[++nIdx] - 128 << 24)
                            + (aBytes[++nIdx] - 128 << 18)
                            + (aBytes[++nIdx] - 128 << 12)
                            + (aBytes[++nIdx] - 128 << 6)
                            + aBytes[++nIdx] - 128
                            : nPart > 247 && nPart < 252 && nIdx + 4 < nLen ?
                                (nPart - 248 << 24)
                                + (aBytes[++nIdx] - 128 << 18)
                                + (aBytes[++nIdx] - 128 << 12)
                                + (aBytes[++nIdx] - 128 << 6)
                                + aBytes[++nIdx] - 128
                                : nPart > 239 && nPart < 248 && nIdx + 3 < nLen ?
                                    (nPart - 240 << 18)
                                    + (aBytes[++nIdx] - 128 << 12)
                                    + (aBytes[++nIdx] - 128 << 6)
                                    + aBytes[++nIdx] - 128
                                    : nPart > 223 && nPart < 240 && nIdx + 2 < nLen ?
                                        (nPart - 224 << 12)
                                        + (aBytes[++nIdx] - 128 << 6)
                                        + aBytes[++nIdx] - 128
                                        : nPart > 191 && nPart < 224 && nIdx + 1 < nLen ?
                                            (nPart - 192 << 6)
                                            + aBytes[++nIdx] - 128
                                            :
                                            nPart
                    );
                }

                return sView;
            }

            function strToUtf8Arr(sDOMStr) {
                var aBytes;
                var nChr;
                var nStrLen = sDOMStr.length;
                var nArrLen = 0;

                // Determine the byte-length of the string when encoded as UTF-8.
                for (var nMapIdx = 0; nMapIdx < nStrLen; nMapIdx++) {
                    nChr = sDOMStr.charCodeAt(nMapIdx);
                    nArrLen += nChr < 0x80 ?
                        1
                        : nChr < 0x800 ?
                            2
                            : nChr < 0x10000 ?
                                3
                                : nChr < 0x200000 ?
                                    4
                                    : nChr < 0x4000000 ?
                                        5
                                        :
                                        6;
                }

                aBytes = new Uint8Array(nArrLen);

                // Perform the encoding.
                for (var nIdx = 0, nChrIdx = 0; nIdx < nArrLen; nChrIdx++) {
                    nChr = sDOMStr.charCodeAt(nChrIdx);
                    if (nChr < 128) {
                        /* one byte */
                        aBytes[nIdx++] = nChr;
                    } else if (nChr < 0x800) {
                        /* two bytes */
                        aBytes[nIdx++] = 192 + (nChr >>> 6);
                        aBytes[nIdx++] = 128 + (nChr & 63);
                    } else if (nChr < 0x10000) {
                        /* three bytes */
                        aBytes[nIdx++] = 224 + (nChr >>> 12);
                        aBytes[nIdx++] = 128 + (nChr >>> 6 & 63);
                        aBytes[nIdx++] = 128 + (nChr & 63);
                    } else if (nChr < 0x200000) {
                        /* four bytes */
                        aBytes[nIdx++] = 240 + (nChr >>> 18);
                        aBytes[nIdx++] = 128 + (nChr >>> 12 & 63);
                        aBytes[nIdx++] = 128 + (nChr >>> 6 & 63);
                        aBytes[nIdx++] = 128 + (nChr & 63);
                    } else if (nChr < 0x4000000) {
                        /* five bytes */
                        aBytes[nIdx++] = 248 + (nChr >>> 24);
                        aBytes[nIdx++] = 128 + (nChr >>> 18 & 63);
                        aBytes[nIdx++] = 128 + (nChr >>> 12 & 63);
                        aBytes[nIdx++] = 128 + (nChr >>> 6 & 63);
                        aBytes[nIdx++] = 128 + (nChr & 63);
                    } else /* if (nChr <= 0x7fffffff) */ {
                        /* six bytes */
                        aBytes[nIdx++] = 252 + (nChr >>> 30);
                        aBytes[nIdx++] = 128 + (nChr >>> 24 & 63);
                        aBytes[nIdx++] = 128 + (nChr >>> 18 & 63);
                        aBytes[nIdx++] = 128 + (nChr >>> 12 & 63);
                        aBytes[nIdx++] = 128 + (nChr >>> 6 & 63);
                        aBytes[nIdx++] = 128 + (nChr & 63);
                    }
                }

                return aBytes;
            }

            function webAuthnSign(webAuthnSignRequest) {
                var publicKeyCredentialRequestOptions = {
                    challenge: webAuthnBase64DecToArr(webAuthnSignRequest.challenge),
                    allowCredentials: webAuthnSignRequest.allowCredentials.map(function (x) {
                        return {
                            id: webAuthnBase64DecToArr(x.id),
                            type: x.type,
                            transports: x.transports
                        }
                    }),
                    rpId: webAuthnSignRequest.rpId,
                    userVerification: webAuthnSignRequest.userVerification,
                    timeout: webAuthnSignRequest.timeout || 60000
                };

                return navigator
                    .credentials
                    .get({ publicKey: publicKeyCredentialRequestOptions })
                    .then(function (assertion) {
                        if (!assertion) {
                            console.log("WebAuthnSign: assertion failed!");
                            return Promise.reject();
                        }

                        var webAuthnSignResponse = {
                            credentialid: assertion.id,
                            clientdata: webAuthnBase64EncArr(assertion.response.clientDataJSON),
                            signaturedata: webAuthnBase64EncArr(assertion.response.signature),
                            authenticatordata: webAuthnBase64EncArr(assertion.response.authenticatorData)
                        };

                        if (assertion.response.userHandle) {
                            webAuthnSignResponse.userhandle = utf8ArrToStr(
                                assertion.response.userHandle);
                        }

                        if (assertion.response.assertionClientExtensions) {
                            webAuthnSignResponse.assertionclientextensions = webAuthnBase64EncArr(
                                strToUtf8Arr(JSON.stringify(assertion.response.assertionClientExtensions)))
                        }

                        return Promise.resolve(webAuthnSignResponse);
                    });
            }
        </script>
    </form>
